name: full workflow

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: full-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-workflow:
    name: pytest --run-workflow
    runs-on: ubuntu-latest
    # Run in Rocky Linux 8, the FASRC cluster's OS, so that R computes with the cluster's C math library (glibc 2.28),
    # as when tests/reference_outputs was made. On the runner's own Ubuntu, SCTransform estimates the dispersion of a
    # few nearly Poisson genes slightly differently: under Ubuntu 26.04 (ubuntu-latest from November 2026), that
    # changed a few rounded SCT counts in two of the reference objects and moved two cells to another cluster.
    container:
      image: rockylinux:8.10
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -el {0}
    env:
      SNAKEMAKE_CONDA_FRONTEND: mamba
      GITHUB_PAT: ${{ github.token }}
      TEST_WORKFLOW_PROFILE_ARGS: >-
        --profile none
        --workflow-profile none
        --executor local
        --cores 2
      TEST_WORKFLOW_JOBS: "2"
      TEST_WORKFLOW_SNAKEMAKE_ARGS: >-
        --resources mem_mb=8192
        --set-resources
        cellbender:mem_mb=3072
        cellbender:runtime=30
        tenx2seuratrds:mem_mb=2048
        tenx2seuratrds:runtime=10
        emptydrops:mem_mb=2048
        emptydrops:runtime=10
        soupx:mem_mb=2048
        soupx:runtime=10
        soupx_emptydrops:mem_mb=2048
        soupx_emptydrops:runtime=10
        decontx_raw:mem_mb=2048
        decontx_raw:runtime=10
        cellbender2seurat:mem_mb=2048
        cellbender2seurat:runtime=10
        doubletfinder:mem_mb=2048
        doubletfinder:runtime=10
        doubletfinder_cellbender:mem_mb=2048
        doubletfinder_cellbender:runtime=10
        scdblfinder:mem_mb=3072
        scdblfinder:runtime=10
        scdblfinder_cellbender:mem_mb=3072
        scdblfinder_cellbender:runtime=10
        posthocfilter_mad:mem_mb=3072
        posthocfilter_mad:runtime=10
        posthocfilter_mad_cellbender:mem_mb=3072
        posthocfilter_mad_cellbender:runtime=10
        posthocfilter_threshold:mem_mb=2048
        posthocfilter_threshold:runtime=10
        posthocfilter_threshold_cellbender:mem_mb=2048
        posthocfilter_threshold_cellbender:runtime=10
        marker_manifest:mem_mb=1024
        marker_manifest:runtime=5
        find_markers:mem_mb=2048
        find_markers:runtime=5
        combine_markers:mem_mb=1024
        combine_markers:runtime=5
    steps:
      # The image lacks git, which actions/checkout uses, and the en_US.UTF-8 locale the cluster runs R in.
      - name: Install system packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar gzip bzip2 which findutils diffutils procps-ng glibc-langpack-en
          ldd --version | head -n 1
          echo "LANG=en_US.UTF-8" >> "${GITHUB_ENV}"

      - name: Check out repository
        uses: actions/checkout@v4

      # In a container job, ${{ github.workspace }} names the runner's directory, not the container's,
      # so these paths come from $GITHUB_WORKSPACE.
      - name: Add test command shims to PATH
        run: |
          echo "${GITHUB_WORKSPACE}/tests/bin" >> "${GITHUB_PATH}"
          echo "TEST_WORKFLOW_FAKE_CELLBENDER_SOURCE=${GITHUB_WORKSPACE}/tests/reference_outputs/testdata/results/cellbender" >> "${GITHUB_ENV}"

      - name: Create test environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Cache Snakemake rule environments
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          # Snakemake hashes each environment's path into its directory name, so environments built outside
          # the container, under /home/runner, would never be used here.
          key: snakemake-conda-full-rocky8-${{ hashFiles('workflow/envs/*.yml', 'workflow/envs/*.pin.txt') }}
          restore-keys: |
            snakemake-conda-full-rocky8-

      - name: Run full test-data workflow
        run: pytest tests --run-workflow -q

      # On failure, keep what is needed to compare the run with the cluster's: the outputs, Snakemake's logs
      # (they hold any warning that the pin file could not be installed) and each rule environment's packages.
      - name: Collect rule environment details
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          ls -la .snakemake/conda > ci-diagnostics/snakemake-conda-dir.txt 2>&1 || true
          for env_dir in .snakemake/conda/*_; do
            [ -d "${env_dir}" ] || continue
            conda list --explicit -p "${env_dir}" > "ci-diagnostics/$(basename "${env_dir}").explicit.txt" 2>&1 || true
          done
          cp .snakemake/conda/*.yaml .snakemake/conda/*.pin.txt ci-diagnostics/ 2>/dev/null || true
          cp -r .snakemake/log ci-diagnostics/snakemake-log 2>/dev/null || true

      - name: Upload test-data outputs and diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-workflow-outputs
          path: |
            testdata/results
            ci-diagnostics
          retention-days: 14
          if-no-files-found: warn
