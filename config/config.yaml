conda-channel-priority: "strict"

sampleTable: "samplesheet.tsv"
workflow_mode: "preprocess_and_downsample" # {"preprocess", "preprocess_and_downsample", "downsample_only"}
workflow_seed: 12345

# Sample IDs to skip when building the workflow (they are dropped from the DAG, so their
# outputs are neither generated nor regenerated). Use this to exclude samples flagged as
# low quality after a run (see the run log and results/low_quality_samples/flagged_samples.txt)
# or any sample you want to hold out. Exclusion is explicit and logged at startup - nothing
# is skipped automatically. IMPORTANT: if you re-sequence a bad library and reuse its sample
# ID in samplesheet.tsv, remove that ID from this list so the new data is processed.
excluded_samples: ["cteleta"]

# Preflight quality gate (runs before any job): counts the called cells in each sample's
# CellRanger filtered_feature_bc_matrix and handles samples with too few to cluster.
#   preflight_mode: "skip" drops them from the DAG and reports them - re-checked every run, so a
#     re-sequenced sample with more cells is picked up automatically; "error" hard-stops the run;
#     "warn" only reports; "off" disables the check.
# Only the CellRanger filtered count is known preflight; the runtime min-cells guard and the
# results/low_quality_samples/ quarantine remain the backstop for the emptydrops/cellbender arms.
preflight_min_cells: 100
preflight_mode: "skip"

emptydrop_removal_methods: ["tenx","emptydrops"]
ambient_decon_methods: ["soupx","cellbender_fromraw","decontx_raw"]
doublet_removal_methods: ["doubletfinder", "scdblfinder"]
posthoc_methods: ["threshold"]

# CellBender (cellbender_fromraw arm) adaptive re-run. After the initial run, the HTML report's
# automated assessment is parsed: if the learning curve looks normal, that run is kept; if the
# report recommends halving the learning rate and cellbender_adaptive_rerun is true, CellBender is
# re-run at half cellbender_learning_rate and the re-run is kept only if ITS curve looks normal
# (otherwise the initial run is kept). results/cellbender/cellbender_adaptive_summary.tsv reports
# which samples needed a re-run and whether it resolved the issue.
cellbender_learning_rate: 0.0001      # CellBender's default; the re-run uses exactly half of this
cellbender_adaptive_rerun: true       # set false to always keep the single initial run

# CellBender calls cells and removes ambient RNA in one model, so cellbender_fromraw carries both
# effects. cellbender_cell_calls also builds the barcodes CellBender called as cells on their RAW
# counts (results/cellbendercells/), with the CellRanger rule's script, then clusters, marker-tests
# and downsamples them like the CellRanger (tenx) and emptyDrops cell-calling objects, isolating
# CellBender's cell calling before any decontamination. Requires cellbender_fromraw (above).
cellbender_cell_calls: true
min_nfeature: 200
min_ncount: 500
# No % mitochondrial filter (max_mtdna was removed 2026-10-30): mitochondrial genes are recognisable by
# name in few species, so an mt cap would treat samples unequally. percent.mt is always kept as cell
# metadata, the percentage of a cell's RNA counts from mitochondrial genes: by default the genes whose
# names match "(?i)^mt-"; a sample-sheet column mt_genes can instead give, per sample, a file of its
# mitochondrial gene IDs (README, "Mitochondrial genes and regression").
#
# vars_to_regress: cell metadata columns that every SCTransform call regresses out of its residuals
# (Seurat's vars.to.regress), in preprocessing and in each downsampling replicate. Any of "percent.mt",
# "nCount_RNA", "nFeature_RNA". The default [] regresses nothing. With "percent.mt", a sample with no
# mitochondrial feature (by the "(?i)^mt-" pattern, or in its mt_genes list) stops the run.
vars_to_regress: []

downsampleSeuratObjectDir: "seurat_objects"
downsampleResultsDir: "results/downsampling"
downsampleTargets: "all"
nDownsampleReplicates: 100
downsampleRate: 0.8
