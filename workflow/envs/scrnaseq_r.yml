# One R environment for every R step (cell calling, decontamination, doublet removal, post-hoc
# filtering, markers, downsampling), so all methods run on the same R and package versions.
# Snakemake builds it from scrnaseq_r.linux-64.pin.txt; this file records the requested set.
# Newest versions that solve together on conda-forge + bioconda (2026-11-06): R 4.5.3,
# Bioconductor 3.22.
channels:
 - conda-forge
 - bioconda
channel_priority: strict
dependencies:
 - r-base=4.5.3
 - r-seurat=5.5.1
 - r-seuratobject=5.4.0
 - r-sctransform=0.4.3
 - r-tidyverse=2.0.0
 - r-matrix=1.7_6
 - r-r.utils
 - r-rcppparallel
 - r-sccustomize=3.3.0
 - r-hdf5r=1.3.16
 - r-presto=1.0.0
 - r-soupx=1.6.2
 - r-fields
 - r-kernsmooth
 - r-rocr
 - r-igraph
 - r-remotes
 - git
 - bioconductor-glmgampoi=1.22.0
 - bioconductor-bluster=1.20.0
 - bioconductor-dropletutils=1.30.0
 - bioconductor-rhdf5
 - bioconductor-scater=1.38.1
 - bioconductor-scdblfinder=1.24.10
 - r-xgboost=3.2.0  # held below 3.4: xgboost >= 3.4 makes scDblFinder < 1.27.12 skip its classifier
 - libxgboost=3.2.0  # (training errors on early_stopping_rounds and is silently caught; dmlc/xgboost#12370)
 - bioconductor-decontx=1.8.0
 - bioconductor-biocparallel
